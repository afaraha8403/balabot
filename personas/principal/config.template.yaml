model:
  default: deepseek/deepseek-v4.1-flash
  provider: openrouter
browser:
  backend: browser-use
  # No cdp_url baked in: a hardcoded host CDP endpoint (and its rotating UUID)
  # is meaningless inside the container. Point it at a real browser at runtime
  # if you need one, e.g. via the BROWSER_CDP_URL environment variable.
memory:
  memory_enabled: true
  user_profile_enabled: true
  provider: holographic
plugins:
  enabled:
  - texting-style
computer_use:
  backend: cua
_config_version: 40
platform_toolsets:
  cli:
  - browser
  - clarify
  - code_execution
  - cronjob
  - delegation
  - file
  - image_gen
  - memory
  - session_search
  - skills
  - terminal
  - todo
  - tts
  - vision
  - web
  api_server:
  - browser
  - clarify
  - code_execution
  - cronjob
  - delegation
  - file
  - image_gen
  - memory
  - session_search
  - skills
  - terminal
  - todo
  - tts
  - vision
  - web
known_plugin_toolsets:
  cli:
  - a2a
  - spotify
known_builtin_toolsets:
  cli:
  - browser
  - clarify
  - code_execution
  - computer_use
  - context_engine
  - cronjob
  - delegation
  - discord
  - discord_admin
  - file
  - homeassistant
  - image_gen
  - memory
  - session_search
  - skills
  - spotify
  - stt
  - terminal
  - todo
  - tts
  - video
  - video_gen
  - vision
  - web
  - x_search
  - yuanbao
gateway:
  api_server:
    enabled: true
    host: 127.0.0.1
    port: 9121
# secrets.sources is intentionally NOT baked in.
#
# A shipped image must not reference the machine it was built on: the previous
# value pointed at a host Python interpreter and a host helper script
# (C:/Users/<author>/...), so in-container resolution failed with code=127 and
# NO secrets were ever delivered. Configure your own sources at runtime, or
# provide keys through the environment.
telegram:
  bot_token: ''
  allowed_chats: []
terminal:
  # Must be a path that exists INSIDE the image (the persona's own workspace),
  # never a host path.
  cwd: /opt/data/workspace/principal

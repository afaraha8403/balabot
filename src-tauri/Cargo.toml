[package]
name = "balabot-desktop"
version = "1.0.0"
description = "BalaBot Native Desktop Shell"
authors = ["BalaBot Team"]
edition = "2021"

[lib]
name = "balabot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.6", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

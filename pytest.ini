[pytest]
# Collect the architecture simulations ALONGSIDE the unit tests.
#
# They are named sim_*.py, which pytest's default pattern (test_*.py) does not
# match — so without this line the simulations exist in the repo but never run:
# green CI over zero coverage, which is the worst of both worlds.
python_files = test_*.py sim_*.py
# Repo root on sys.path so `import balabot` resolves without a PYTHONPATH export
# (conftest.py also does this defensively, for direct invocations).
pythonpath = .
testpaths = tests

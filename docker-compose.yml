# BalaBot — ONE service, ONE container. No sidecars, no second service.
services:
  balabot:
    build: .
    image: balabot:latest

    # DO NOT set `init: true` here.
    #
    # The Hermes entrypoint delegates to s6-overlay's /init and REQUIRES PID 1
    # (`$$ -eq 1`) to do it. `init: true` injects docker-init as PID 1, so the
    # entrypoint sees it is not PID 1, skips s6 entirely and falls back to a
    # direct bootstrap — logging "Supervised services are unavailable in this
    # runtime". That silently costs the whole supervision tree: the dashboard,
    # the cloudflared tunnel, and the principal's ability to restart agents.
    #
    # s6-overlay IS the init system, so it already reaps orphaned children;
    # an extra init is both unnecessary and actively harmful.
    #
    #   verified 2026-09-26: with `init: true`, /proc/1/comm = docker-init and
    #   the log warns that s6 was skipped. Without it, /init owns PID 1 and all
    #   services register.

    # Secrets come from .env (never baked into the image). Required:
    #   TYPESAFE_API_KEY  (hard dependency — the container exits without it)
    #   OPENROUTER_API_KEY
    env_file:
      - .env

    environment:
      # The agent API servers default to binding 127.0.0.1 INSIDE the container
      # (DEFAULT_HOST in gateway/platforms/api_server.py), which Docker's port
      # forwarder cannot reach: it publishes on the container's eth0, finds
      # nothing listening there, and the host gets connection-refused (curl 000)
      # even though `docker port` cheerfully reports the mapping.
      #
      # Binding 0.0.0.0 inside the container is what makes the published port
      # work. It is not an open surface: the listener still refuses every request
      # without a valid `Authorization: Bearer $API_SERVER_KEY` (401).
      API_SERVER_HOST: "0.0.0.0"

      # ── Timeout ceilings ──────────────────────────────────────────────────
      # These are the limits that bound what an agent in the product can get
      # done. They are set explicitly here rather than left to the base image's
      # .env.example, whose defaults are tuned for a human at a REPL and are too
      # tight for agents doing real work.

      # Hermes' .env.example ships TERMINAL_TIMEOUT=60, which is TIGHTER than the
      # code default of 180 (tools/terminal_tool.py falls back to 180 when the var
      # is unset). 60s means an agent cannot run a build, an install, or a scrape
      # to completion. 600 is the hard foreground ceiling
      # (TERMINAL_MAX_FOREGROUND_TIMEOUT, terminal_tool.py:75) and is the most a
      # synchronous command can use.
      TERMINAL_TIMEOUT: "600"

      # Subagent inactivity cap. 0 disables it, which is Hermes' own default: a
      # positive value kills a child after that many seconds of NO progress and
      # discards its whole context, which upstream removed because legitimate
      # heavy work (deep reviews, research fan-outs, slow reasoning models) died
      # mid-task. Stuck children are caught by the heartbeat staleness monitor
      # instead. Set deliberately so a stray profile value cannot re-introduce a
      # wall-clock kill on agents doing long work.
      DELEGATION_CHILD_TIMEOUT_SECONDS: "0"


    # The inherited default command is Hermes' interactive CLI, which exits
    # cleanly when stdin is not a terminal. Keep a TTY attached so
    # `docker compose up` lands you in a live principal agent.
    # For unattended/daemon operation, configure a messaging platform
    # (e.g. telegram.bot_token) and run the gateway instead — see README.
    stdin_open: true
    tty: true

    volumes:
      # Persist the whole Hermes home. The official image sets HERMES_HOME=/opt/data
      # (verified) — NOT ~/.hermes — so this volume holds profiles, per-agent memory
      # stores, the governor's ledger, and the persona workspaces together.
      - balabot-state:/opt/data

    ports:
      # ONE multiplexed listener serves every profile's OpenAI-compatible agent
      # API (verified: the gateway reports
      #   principal/api_server -> http://127.0.0.1:8642/p/principal/v1
      #   governor/api_server  -> http://127.0.0.1:8642/p/governor/v1
      # ). The per-profile `gateway.api_server.port` values are IGNORED while
      # multiplexing is on — there is a single shared port, 8642. Publishing two
      # separate ports (9121/9122) would publish nothing.
      #
      # Docker Desktop note: publishing as "127.0.0.1:8642:8642" binds the WSL
      # VM's loopback, which the Windows host CANNOT reach (curl -> 000, and
      # nothing in the host's netstat). Publish without the host-IP prefix so the
      # forwarder actually binds. The port stays key-gated (401 without a valid
      # Authorization: Bearer), so this is not an open surface — but it IS
      # reachable from the LAN, so keep the key strong.
      - "8642:8642"

      # NOTE: the Hermes dashboard (HERMES_DASHBOARD=1) is deliberately NOT
      # published. It is a generic admin surface, not the product UI, and it must
      # not sit behind the public hostname. Reach it over `docker exec` if needed.

    restart: unless-stopped

volumes:
  balabot-state:
